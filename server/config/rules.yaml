# 分类规则与等级（改完重启服务器即可生效，各设备上的小工具不用更新）

# 锚定状态：rank 越小越优先（自定义锚定 > 上课 > 吃饭 / 睡觉 > 办公室）
anchors:
  custom: { rank: 0, short: "自定义", label: "{text}" }
  class: { rank: 1, short: "上课", label: "正在上《{course}》" }
  eat: { rank: 2, short: "吃饭", label: "吃饭中" }
  sleep: { rank: 2, short: "睡觉", label: "睡觉中" }
  # activity：Mac 上正在做这件事时合并进主状态（不再单列），并显示它的今日时长
  office: { rank: 3, short: "办公室", label: "在办公室搞科研", activity: research }

# 活动：tier 越小等级越高；serious 表示“正事”（余温期间显示摸鱼标记）
# keep_min：离开后在页面上继续保留多久（余温），只影响显示，不计入时长；
#           切到同一等级的活动时立刻消失。出门、自定义有自己的有效期，不需要
# show_project：公开显示工作区文件夹名（VS Code 窗口标题、Claude Code / Codex 会话里识别出的项目名）
activities:
  research: { tier: 1, short: "科研", label: "搞科研", keep_min: 10, serious: true, show_project: true }
  dev: { tier: 1, short: "开发", label: "搞开发", keep_min: 10, serious: true, show_project: true }
  game: { tier: 2, short: "游戏", label: "玩《{name}》", keep_min: 3 }
  out: { tier: 2, short: "出去玩", label: "出去玩" }
  custom: { tier: 2, short: "自定义", label: "{text}" }
  video: { tier: 3, short: "看视频", label: "看视频", keep_min: 1 }
  browse: { tier: 3, short: "上网", label: "网上冲浪", keep_min: 1 }
  phone: { tier: 4, short: "刷手机", label: "在刷 {app}" }
  music: { tier: 4, short: "听歌", label: "听《{title}》", keep_min: 1 }

# 手机 App：键是快捷指令上报的 App 名（已装的快捷指令按这个名字上报，不要改键）
#   label：公开文案（未列出的 App 沿用“在刷 {app}”）；icon：web/public/icons/apps/<icon>.png
phone_apps:
  X: { label: "在 X 上刷动态", icon: x }
  Instagram: { label: "在 IG 看看大家的日常", icon: instagram }
  小黑盒: { label: "在刷小黑盒", icon: xiaoheihe }
  小红书: { label: "在小红书翻翻生活灵感", icon: xiaohongshu }
  抖音: { label: "在抖音刷短视频", icon: douyin }
  TikTok: { label: "在 TikTok 刷短视频", icon: tiktok }
  Reddit: { label: "在 Reddit 逛社区", icon: reddit }
  Apple Music: { label: "在 Apple Music 上听音乐", icon: apple-music }
  Discord: { label: "在 Discord 里聊天", icon: discord }
  Telegram: { label: "在 Telegram 看消息、聊聊天", icon: telegram }
  WhatsApp: { label: "在 WhatsApp 和朋友聊聊天", icon: whatsapp }
  Facebook: { label: "在 Facebook 看看新动态", icon: facebook }
  Safari: { label: "在用 Safari 逛网页", icon: safari }
  B站: { label: "在刷 B站", icon: bilibili }
  YouTube: { label: "在 YouTube 看视频", icon: youtube }
  ChatGPT: { label: "在和 ChatGPT 聊天", icon: chatgpt }
  DeepSeek: { label: "在和 DeepSeek 聊天", icon: deepseek }
  Claude: { label: "在和 Claude 聊天", icon: claude }
  淘宝: { label: "在淘宝淘点好东西", icon: taobao }
  京东: { label: "在京东逛逛", icon: jd }
  闲鱼: { label: "在闲鱼淘二手", icon: xianyu }

# Mac 前台的分类顺序：项目 → 域名 → App 默认值；都没命中时沿用上一个活动。
#   项目算科研还是开发在 Mac 小工具的 设置 → 项目 里选，随信号上报（data.category）；没选的项目按 App 默认值算。

# 域名匹配（Safari 在前台时）；子域名自动匹配，例如 www.bilibili.com
#    reference：资料类，继承最近 10 分钟的正事；未列出的网页同样处理
#    写成 { category, name, video } 时：name 是公开显示名，video 是浏览器上报视频时的 site 键
domains:
  overleaf.com: research
  arxiv.org: reference
  scholar.google.com: reference
  github.com: reference
  stackoverflow.com: reference
  bilibili.com: { category: video, name: B站, video: bilibili }
  youtube.com: { category: video, name: YouTube, video: youtube }

# App 默认值（按 bundle id）
apps:
  com.mathworks.matlab: research
  com.microsoft.Powerpoint: research
  com.apple.iWork.Keynote: research
  com.github.GitHubClient: dev
  com.microsoft.VSCode: dev
  com.anthropic.claudefordesktop: dev
  com.openai.codex: dev

# 音乐卡片上的播放器名，键是信号里的 player
players:
  apple_music: Apple Music
  aimp: AIMP
