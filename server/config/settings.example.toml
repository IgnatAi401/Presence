# 示例配置：复制为 settings.toml 后填写（settings.toml 不进 Git）
#   cp config/settings.example.toml config/settings.toml

[server]
timezone = "Asia/Shanghai"
day_start_hour = 4                 # 一天从凌晨 4 点开始算
db_path = "data/presence.db"       # 相对 server/ 目录
public_origins = ["https://now.ignat.ai", "https://ignat.ai"]
extra_origins = []                 # 本地调试页面的来源，例如 "http://localhost:8788"（公开和私有接口都允许）
private_origins = ["https://now.ignat.ai"]   # 可以带登录 Cookie 读取私有接口（/me 页面）的来源
# 网关密钥：和 ignat-auth 的 ORIGIN_SECRET 相同。空着时私有接口一律 404
# 生成：uv run python -c "import secrets; print(secrets.token_urlsafe(32))"
gate_secret = ""
dev_private = false                # 仅本机调试 /me：不经过 Cloudflare 的请求不检查网关密钥。服务器 Mac 上保持 false
backup_keep = 30                   # 每天第一次推进时把数据库备份到 data/backups/，保留最近几份；0 表示不备份
media_base = "https://api.ignat.ai/presence/api/media"
media_max_bytes = 2097152          # 设备上传封面的大小上限（字节）；图片存在数据库旁边的 media/ 目录
rate_per_minute = 60               # 每台设备每分钟最多上报次数
max_streams = 200                  # SSE 连接上限

# 设备令牌：设备名 = 令牌。设备名就是信号的来源（source），删掉一行即吊销该设备
# 生成令牌：uv run python -c "import secrets; print(secrets.token_urlsafe(32))"
[devices]
mac = ""
windows = ""
iphone = ""

# 状态引擎的阈值（单位：秒 / 分钟 / 小时，见变量名），不写就用默认值
[engine]
enter_sec = 10                     # 切到新活动停留这么久才显示，更短的切换当作没发生
away_sec = 600
context_sec = 600
eat_min = 60
sleep_max_h = 14
wake_active_sec = 600

# 苹果日历里的课程表
[calendar]
enabled = true
name = "课程表"
title_strip = '\s*[（(].*$'        # 去掉标题里括号及之后的内容（教室、教师等）
refresh_hours = 6

# Steam 正在玩的游戏：两项都填了才会轮询；Steam 隐私设置里“游戏详情”要设为公开
# 填好后检查：uv run python -m presence.sources.steam
[steam]
api_key = ""                       # Steam Web API Key：大写字母 + 数字，32 位（https://steamcommunity.com/dev/apikey）
steam_id = ""                      # SteamID64：纯数字，17 位，7656119 开头
poll_sec = 60                      # 没在玩时多久查一次
playing_poll_sec = 30              # 在玩时多久查一次
